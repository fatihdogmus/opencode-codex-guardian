name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Require the current main commit
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - name: Check npm credentials before changing the version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Set the NPM_TOKEN secret before releasing."
            exit 1
          fi
          npm whoami --registry https://registry.npmjs.org/
      - run: npm ci --ignore-scripts
      - name: Bump package and lockfile versions
        id: bump
        env:
          VERSION_BUMP: ${{ inputs.bump }}
        run: node scripts/bump-release.mjs "$VERSION_BUMP"
      - name: Require a new release tag
        env:
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release tag already exists: $RELEASE_TAG"
            exit 1
          fi
      - run: npm run check
      - run: mkdir -p artifacts
      - run: npm pack --ignore-scripts --pack-destination artifacts
      - run: npm run smoke -- artifacts/*.tgz
      - name: Validate tested package
        env:
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: node scripts/validate-release.mjs "$RELEASE_TAG" artifacts/*.tgz
      - name: Save tested package for recovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opencode-codex-guardian-release
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Commit version and push matching tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git diff --check
          git diff --exit-code -- . ':!package.json' ':!package-lock.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore(release): $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          gh auth setup-git
          git push --atomic origin HEAD:main "refs/tags/$RELEASE_TAG"
      - name: Publish tested tarball to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./artifacts/*.tgz --ignore-scripts --access public --provenance --tag latest --registry https://registry.npmjs.org/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: gh release create "$RELEASE_TAG" artifacts/*.tgz --verify-tag --title "$RELEASE_TAG" --generate-notes
