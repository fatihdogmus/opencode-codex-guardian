name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.event.release.prerelease == false
    uses: ./.github/workflows/build.yml
    with:
      release-check: true
      release-tag: ${{ github.event.release.tag_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Download tested package from this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name opencode-codex-guardian --dir artifacts
      - name: Validate package identity and release version
        run: node scripts/validate-release.mjs "$RELEASE_TAG" artifacts/*.tgz
      - name: Publish tested tarball publicly with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Set the NPM_TOKEN secret before publishing."
            exit 1
          fi
          npm publish ./artifacts/*.tgz --ignore-scripts --access public --provenance --tag latest --registry https://registry.npmjs.org/
