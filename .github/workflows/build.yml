name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-check:
        description: Require release metadata and live security reports
        type: boolean
        default: false
      release-tag:
        description: Stable release tag matching package.json
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Validate release metadata
        if: inputs.release-check
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: node scripts/validate-release.mjs "$RELEASE_TAG"
      - name: Require a commit on main
        if: inputs.release-check
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - run: npm run check
      - run: npm run benchmark -- --compare benchmarks/baseline.boundary.json
      - name: Gate release on live security reports
        if: inputs.release-check
        run: npm run benchmark:release
      - run: mkdir -p artifacts
      - run: npm pack --ignore-scripts --pack-destination artifacts
      - run: npm run smoke -- artifacts/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opencode-codex-guardian
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
